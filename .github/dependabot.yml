---
version: 2

updates:
  # NuGet packages used by the ASP.NET Core project (in this directory is .csproj file)
  - package-ecosystem: "nuget"
    directory: "/AbsenceManagementSystem"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Sofia"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Sofia"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "ci"