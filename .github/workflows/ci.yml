# This workflow builds and tests the AbsenceSystem project

name: CI

# Controls when the workflow will run
on:

  # Triggers the workflow on push events, but only for the "main" branch
  push:
    branches: [ "main" ]

  # Triggers the workflow on pull request events, but only for the "main" branch
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs
# that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build:

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks
    # that will be executed as part of the job
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE,
      # so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up the .NET SDK required to build the project
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # Restores all NuGet dependencies required by the project
      - name: Restore dependencies
        run: dotnet restore

      # Builds the project in Release configuration
      # The --no-restore option prevents restoring dependencies again
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # Runs all automated tests in the solution
      # The --no-build option prevents building the project again
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Checks whether the code follows the formatting rules
      # defined in the project
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic